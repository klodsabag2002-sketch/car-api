<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>דמו: הרובוט המדריך</title>
<style>
  body { margin: 0; font-family: 'Segoe UI', Arial, sans-serif; background: #f4f6fa; color: #1e293b; min-height: 100vh; }
  .wrap { max-width: 820px; margin: 0 auto; padding: 16px; }
  h1 { font-size: 20px; text-align: center; margin: 8px 0 12px; }
  .controls { display: flex; gap: 8px; justify-content: center; margin-bottom: 6px; }
  .controls button { padding: 10px 16px; border-radius: 10px; border: 1px solid #94a3b8; background: #fff; font-size: 14px; font-weight: 700; cursor: pointer; }
  .controls button.primary { background: #0284c7; color: #fff; border-color: #0284c7; }
  .controls button:disabled { opacity: .5; cursor: not-allowed; }
  #status { text-align: center; font-size: 13px; color: #64748b; margin-bottom: 8px; min-height: 18px; }

  .stage { position: relative; width: 780px; max-width: 100%; height: 640px; margin: 0 auto; }
  .monitor { position: absolute; left: 10px; top: 10px; width: 480px; height: 560px; background: #3b4a58; border-radius: 18px; padding: 14px; box-sizing: border-box; box-shadow: 0 10px 30px rgba(0,0,0,.15); }
  .stand { position: absolute; left: 200px; top: 570px; width: 100px; height: 40px; background: #3b4a58; border-radius: 0 0 30px 30px; }
  .screen { position: relative; width: 100%; height: 100%; background: #fff; border-radius: 6px; overflow: hidden; }
  #appFrame { position: absolute; top: 0; left: 50%; width: 390px; height: 100%; margin-left: -195px; border: 0; }

  .cursor { position: absolute; left: 0; top: 0; width: 24px; height: 24px; pointer-events: none; z-index: 10; transition: left .6s ease, top .6s ease; }
  .cursor svg { display: block; transition: transform .15s; }
  .cursor.click svg { transform: scale(.8); }

  .robot { position: absolute; left: 540px; top: 300px; width: 170px; height: 220px; }
  .arm-l { transform-box: view-box; transform-origin: 58px 112px; }
  .arm-r { transform-box: view-box; transform-origin: 112px 112px; }
  .eye { transform-box: fill-box; transform-origin: center; }
  /* ההנפשה פעילה רק כשהרובוט מדבר */
  .robot.speaking .arm-r { animation: wave .8s ease-in-out infinite alternate; }
  .robot.speaking .arm-l { animation: wave .8s ease-in-out infinite alternate-reverse; }
  .robot.speaking .eye { animation: blink 3s infinite; }
  @keyframes wave { from { transform: rotate(-12deg); } to { transform: rotate(12deg); } }
  @keyframes blink { 0%, 92%, 100% { transform: scaleY(1); } 96% { transform: scaleY(.1); } }

  .bubble { position: absolute; left: 500px; top: 20px; width: 270px; background: #fff; border: 2px solid #0284c7; border-radius: 16px; padding: 14px; font-size: 16px; line-height: 1.6; box-shadow: 0 6px 18px rgba(0,0,0,.1); opacity: 0; transition: opacity .3s; pointer-events: none; box-sizing: border-box; }
  .bubble.show { opacity: 1; }
  .note { font-size: 12px; color: #64748b; text-align: center; margin-top: 8px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>הרובוט המדריך: פרטי רכב</h1>
  <div class="controls">
    <button id="btnStart" class="primary">▶ התחל</button>
    <button id="btnPause" disabled>⏸ השהה</button>
    <button id="btnStop" disabled>⏹ עצור</button>
  </div>
  <div id="status">מוכן</div>

  <div class="stage">
    <div class="monitor">
      <div class="screen" id="screen">
        <div class="cursor" id="cursor" style="display:none;">
          <svg viewBox="0 0 24 24" width="24" height="24"><path d="M3 2 L3 19 L8 14.5 L11 21 L13.5 20 L10.5 13.5 L17 13.5 Z" fill="#111" stroke="#fff" stroke-width="1.5" stroke-linejoin="round"/></svg>
        </div>
      </div>
    </div>
    <div class="stand"></div>

    <div class="bubble" id="bubble"><span id="bubbleText"></span></div>

    <svg class="robot" id="bot" viewBox="0 0 170 220">
      <line x1="85" y1="0" x2="85" y2="18" stroke="#e76f51" stroke-width="4"/>
      <circle cx="85" cy="0" r="6" fill="#e76f51"/>
      <rect x="30" y="18" width="110" height="80" rx="34" fill="#f07167"/>
      <rect x="45" y="42" width="80" height="34" rx="16" fill="#1e293b"/>
      <circle class="eye" cx="66" cy="59" r="7" fill="#7dd3fc"/>
      <circle class="eye" cx="104" cy="59" r="7" fill="#7dd3fc"/>
      <rect x="55" y="100" width="60" height="60" rx="14" fill="#e76f51"/>
      <circle cx="85" cy="130" r="10" fill="#fff"/>
      <rect x="50" y="160" width="70" height="40" rx="12" fill="#f07167"/>
      <path class="arm-l" d="M55 110 L18 140 L24 152 L60 128 Z" fill="#e76f51"/>
      <path class="arm-r" d="M115 110 L152 140 L146 152 L110 128 Z" fill="#e76f51"/>
    </svg>
  </div>

  <div class="note">הדמו טוען את index.html מאותה תיקייה. צריך להריץ דרך שרת מקומי (ראו הוראות בצ'אט). הסמן הוא הדמיה בלבד ולא עכבר אמיתי.</div>
</div>

<script>
  const PLATE = '12934003';
  const $ = id => document.getElementById(id);
  const screenEl = $('screen'), cursor = $('cursor'), bubble = $('bubble'), bubbleText = $('bubbleText'), bot = $('bot');
  let frame = null, paused = false, stopped = false, running = false;

  class Finish extends Error {}
  const sleep = ms => new Promise(r => setTimeout(r, ms));
  async function gate() {
    while (paused && !stopped) await sleep(100);
    if (stopped) throw new Error('STOP');
  }
  async function wait(ms) {
    const end = Date.now() + ms;
    do { await gate(); await sleep(Math.min(100, Math.max(0, end - Date.now()))); } while (Date.now() < end);
  }

  function doc() { return frame.contentDocument; }
  function q(sel) {
    const el = doc().querySelector(sel);
    if (!el) throw new Error('לא נמצא באפליקציה: ' + sel);
    return el;
  }

  function setStatus(t) { $('status').textContent = t; }
  function say(text) {
    bubbleText.textContent = text;
    bubble.classList.add('show');
    if (!paused) bot.classList.add('speaking');
  }
  function quiet() {
    bubble.classList.remove('show');
    bot.classList.remove('speaking');
  }
  async function explain(text) {
    say(text);
    await wait(Math.max(2500, text.length * 70));
    quiet();
    await wait(300);
  }

  function cursorPoint(el) {
    el.scrollIntoView({ block: 'center' });
    const r = el.getBoundingClientRect();
    const f = frame.getBoundingClientRect();
    const s = screenEl.getBoundingClientRect();
    return { x: f.left - s.left + r.left + r.width / 2, y: f.top - s.top + r.top + r.height / 2 };
  }
  async function moveTo(sel) {
    const el = q(sel);
    const p = cursorPoint(el);
    cursor.style.left = p.x + 'px';
    cursor.style.top = p.y + 'px';
    await wait(700);
    return el;
  }
  async function clickEl(sel) {
    const el = await moveTo(sel);
    cursor.classList.add('click');
    const oldOutline = el.style.outline;
    el.style.outline = '3px solid #f59e0b';
    el.click();
    await wait(250);
    el.style.outline = oldOutline;
    cursor.classList.remove('click');
    await wait(200);
  }
  async function typePlate(sel, digits) {
    const inp = await moveTo(sel);
    inp.focus();
    let cur = '';
    for (const ch of digits) {
      cur += ch;
      inp.value = cur;
      inp.dispatchEvent(new Event('input', { bubbles: true }));
      await wait(150);
    }
  }

  async function waitForCar(timeout = 20000) {
    const start = Date.now();
    while (Date.now() - start < timeout) {
      await gate();
      const d = doc();
      const hero = d.getElementById('hero');
      if (hero && hero.classList.contains('show')) return true;
      const err = d.getElementById('errorMsg');
      if (err && err.style.display === 'block' && err.textContent.trim()) return false;
      const bike = d.getElementById('bikeResult');
      if (bike && bike.style.display === 'block') return false;
      await sleep(200);
    }
    return false;
  }

  function newFrame() {
    if (frame) frame.remove();
    // מנקים מצב שחזור ישן, כדי שהאפליקציה לא תחפש רכב לבד בטעינה
    try { sessionStorage.removeItem('appRestoreState'); } catch (e) {}
    const f = document.createElement('iframe');
    f.id = 'appFrame';
    f.title = 'האפליקציה';
    f.src = 'index.html?demo=1';
    screenEl.insertBefore(f, cursor);
    frame = f;
    return new Promise(res => f.addEventListener('load', res, { once: true }));
  }
  async function startFrame() {
    await newFrame();
    try { void doc().title; }
    catch (e) { throw new Error('הדף חייב לרוץ דרך שרת מקומי, ראו את ההוראות'); }
  }

  const tour = [
    async () => {
      await explain('שלום! אני הרובוט המדריך. זו אפליקציית פרטי רכב, ואני אראה לכם איך היא עובדת.');
    },
    async () => {
      await explain('קודם כל מקלידים מספר רכב בשדה הזה.');
      await typePlate('#plateInput', PLATE);
    },
    async () => {
      await explain('עכשיו לוחצים על "חפש". האפליקציה שולפת את הנתונים ממאגר משרד התחבורה.');
      await clickEl('#searchBtn');
      const ok = await waitForCar();
      if (!ok) {
        await explain('לא הצלחתי לקבל נתונים לרכב הזה. נסו שוב מאוחר יותר או בדקו את החיבור.');
        throw new Finish();
      }
      await wait(600);
    },
    async () => {
      await moveTo('#heroName');
      await explain('כאן רואים את היצרן והדגם של הרכב.');
    },
    async () => {
      await moveTo('.spec-card');
      await explain('בשורה הזו מוצג מפרט מהיר: כוח סוס, תאוצה ומהירות מרבית. חלק מהערכים הם הערכה בלבד.');
    },
    async () => {
      await moveTo('#stTest');
      await explain('כאן רואים אם הטסט בתוקף.');
    },
    async () => {
      await moveTo('#stOwn');
      await explain('וכאן רואים את סטטוס הבעלות.');
    },
    async () => {
      await moveTo('.list-card');
      await explain('ברשימה הזו מופיעים פרטי הרכב: יצרן, דגם, צבע, מספר שלדה, מידות צמיגים ועוד.');
    },
    async () => {
      await clickEl('.tab[data-tab="tech"]');
      await explain('בלשונית "מפרט ובטיחות" מופיעים אבזור ומערכות בטיחות, כמו מצלמת רברס וכריות אוויר.');
    },
    async () => {
      await clickEl('.tab[data-tab="general"]');
      await explain('זהו, ככה נראה סיור קצר באפליקציה. תודה שצפיתם!');
    }
  ];

  function setButtons() {
    $('btnStart').disabled = running;
    $('btnPause').disabled = !running;
    $('btnStop').disabled = !running;
    if (!running) $('btnPause').textContent = '⏸ השהה';
  }

  async function run() {
    if (running) return;
    running = true; stopped = false; paused = false;
    cursor.style.display = '';
    setButtons();
    setStatus('מתחיל...');
    try {
      await startFrame();
      for (const step of tour) await step();
      setStatus('הסיור הסתיים');
    } catch (e) {
      if (e instanceof Finish) setStatus('הסיור הסתיים');
      else if (e.message === 'STOP') setStatus('נעצר');
      else setStatus('שגיאה: ' + e.message);
    } finally {
      running = false; paused = false;
      quiet();
      cursor.style.display = 'none';
      setButtons();
    }
  }

  $('btnStart').onclick = run;
  $('btnPause').onclick = () => {
    if (!running) return;
    paused = !paused;
    $('btnPause').textContent = paused ? '▶ המשך' : '⏸ השהה';
    bot.classList.toggle('speaking', !paused && bubble.classList.contains('show'));
    setStatus(paused ? 'מושהה' : 'רץ');
  };
  $('btnStop').onclick = () => { stopped = true; paused = false; };
  document.addEventListener('keydown', e => { if (e.key === 'Escape') stopped = true; });
  setButtons();
</script>
</body>
</html>
