<title>נורות אזהרה ברכב</title>
<style>
  :root { --bg:#030712; --card:rgba(15,23,42,.7); --line:rgba(56,189,248,.18); --text:#f8fafc; --muted:#94a3b8; --red:#ef4444; --amber:#f59e0b; --green:#22c55e; --blue:#3b82f6; --accent:#38bdf8; }
  body { font-family:'Segoe UI', Arial, Helvetica, sans-serif; background:var(--bg); color:var(--text); margin:0; min-height:100vh; overflow-x:hidden; }
  html[dir="ltr"] body { direction:ltr; }
  .topbar { position:sticky; top:0; z-index:5; display:flex; align-items:center; gap:10px; padding:12px 14px; background:rgba(3,7,18,.92); border-bottom:1px solid rgba(56,189,248,.15); backdrop-filter:blur(6px); }
  .topbar .t { font-size:18px; flex:1; text-align:center; font-weight:900; letter-spacing:1px; color:var(--accent); }
  .topbar a, .topbar button.i { font-size:18px; width:36px; height:36px; display:flex; align-items:center; justify-content:center; cursor:pointer; border-radius:50%; background:rgba(56,189,248,.08); border:1px solid rgba(56,189,248,.25); color:var(--accent); text-decoration:none; font-family:inherit; }
  .topbar button.i.lang-btn { font-size:12px; font-weight:900; letter-spacing:.5px; width:auto; padding:0 12px; border-radius:999px; flex:0 0 auto; }
  .topbar .t { min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .wrap { max-width:560px; margin:0 auto; padding:16px; }
  h1 { display:none; }
  .sub { color:var(--muted); font-size:13px; margin:0 0 14px; line-height:1.6; }
  input[type=search] { width:100%; box-sizing:border-box; padding:12px 14px; border-radius:12px; border:1px solid rgba(56,189,248,.25); background:#030712; color:var(--text); font-size:15px; font-family:inherit; outline:none; }
  .filters { display:flex; gap:8px; margin:12px 0; flex-wrap:wrap; }
  .chip { border:1px solid rgba(56,189,248,.25); background:rgba(56,189,248,.06); color:var(--text); border-radius:999px; padding:6px 12px; font-size:13px; cursor:pointer; font-family:inherit; font-weight:700; }
  .chip.on { border-color:currentColor; box-shadow:0 0 10px rgba(56,189,248,.15); }
  .item { display:flex; gap:12px; align-items:flex-start; background:var(--card); border:1px solid rgba(56,189,248,.15); border-right:4px solid var(--c); border-radius:16px; padding:12px; margin-bottom:10px; box-shadow:0 0 14px rgba(56,189,248,.05); }
  html[dir="ltr"] .item { border-right:1px solid rgba(56,189,248,.15); border-left:4px solid var(--c); }
  .ico { flex:0 0 52px; height:52px; border-radius:12px; background:#030712; border:1px solid rgba(56,189,248,.15); display:flex; align-items:center; justify-content:center; }
  .ico { position:relative; }
  .ico svg { width:42px; height:42px; }
  .mark { position:absolute; bottom:-6px; inset-inline-end:-6px; background:var(--c); color:#030712; font-size:9px; font-weight:900; border-radius:6px; padding:1px 4px; line-height:1.3; letter-spacing:.3px; }
  .body { flex:1; min-width:0; }
  .name { font-weight:800; font-size:16px; }
  .tag { display:inline-block; font-size:11px; font-weight:700; color:var(--c); border:1px solid var(--c); border-radius:999px; padding:1px 8px; margin-inline-start:6px; vertical-align:middle; }
  .desc { font-size:14px; line-height:1.65; margin-top:4px; }
  .act { font-size:13px; color:var(--muted); margin-top:4px; line-height:1.6; }
  .legend { font-size:12px; color:var(--muted); margin:14px 0; line-height:1.8; }
  .note { font-size:12px; color:var(--muted); border-top:1px solid rgba(56,189,248,.15); margin-top:16px; padding-top:12px; line-height:1.7; }
  .empty { color:var(--muted); text-align:center; padding:24px 0; }
</style>
</head>

    search:'חיפוש לפי שם או משמעות', all:'הכול', red:'אדום', amber:'כתום', green:'ירוק', blue:'כחול',
    legend:'<b style="color:var(--red)">אדום:</b> לעצור ולבדוק מיד &nbsp; <b style="color:var(--amber)">כתום/צהוב:</b> לטפל בקרוב &nbsp; <b style="color:var(--green)">ירוק:</b> מידע על מצב פעולה &nbsp; <b style="color:var(--blue)">כחול:</b> מידע בלבד',
    tags:{red:'לעצור מיד', amber:'לטפל בקרוב', green:'מידע', blue:'מידע'},
    act:'מה לעשות:', none:'לא נמצאה נורה מתאימה', note:'הערה:',
    rule:'<b>כלל הצבעים:</b> אם מקור אחד מציין נורה בכתום ומקור אחר באדום, היא מוצגת באדום, כי זה הצבע החמור יותר ומסמן סכנה. כתום מסמן שצריך לטפל בזה בקרוב.',
    disc:'<b>הבהרות חשובות:</b><br>• המידע באתר הוא כללי בלבד, ונועד להסבר ולא לאבחון. לא מדובר בהוראות מקצועיות לתיקון.<br>• סמלי הנורות בדף צוירו בהשראת התקן הבינלאומי ISO 2575, ואינם העתק של סמלים של יצרן מסוים. סמל ברכב שלכם עלול להיראות שונה, ואף לדלוק בצבע אחר.<br>• ייתכן שיש בדף דברים לא מדויקים או לא מעודכנים. לכן יש להסתכל תמיד בספר היצרן של הרכב, שהוא המקור המחייב.<br>• במקרה של ספק, או כשנורה אדומה דולקת, יש לעצור במקום בטוח ולפנות למוסך מורשה או לשירות הדרכים.<br>• האפליקציה אינה קשורה ליצרנים או ליבואנים, ואין לה אישור רשמי מהם. שמות היצרנים מוזכרים לצורך הזיהוי בלבד.<br>• המפעיל לא נושא באחריות לנזק או לתקלה שנובעים משימוש במידע הזה. אין להסתמך על המידע כתחליף לבדיקה במוסך.'
  },
  en: {
    title:'Dashboard warning lights', sub:'An explanation of the most common warning lights on the dashboard. The color shows how urgent it is.<br><b>Note:</b> The drawings are general illustrations based on the international standard. The symbol in your car may look different depending on the manufacturer and model, so check the manufacturer owner manual.',
    search:'Search by name or meaning', all:'All', red:'Red', amber:'Amber', green:'Green', blue:'Blue',
    legend:'<b style="color:var(--red)">Red:</b> stop and check now &nbsp; <b style="color:var(--amber)">Amber:</b> attend soon &nbsp; <b style="color:var(--green)">Green:</b> system status &nbsp; <b style="color:var(--blue)">Blue:</b> information only',
    tags:{red:'Stop now', amber:'Check soon', green:'Info', blue:'Info'},
    act:'What to do:', none:'No matching light found', note:'Note:',

    disc:'<b>Important notes:</b><br>• The information here is general only, for explanation and not diagnosis. It is not professional repair advice.<br>• The symbols are based on the international standard ISO 2575 and are not copies of any manufacturer symbols. The symbol in your car may look different, and may even light up in another color.<br>• Parts of this page may be inaccurate or out of date. Always check the manufacturer owner manual, which is the binding source.<br>• If in doubt, or when a red light is on, stop in a safe place and contact an authorized garage or roadside service.<br>• This app is not affiliated with car manufacturers or importers and has no official approval from them. Manufacturer names are mentioned only for identification.<br>• The operator is not liable for damage or faults resulting from use of this information. Do not rely on it as a replacement for a garage check.'
  }
};
const NOTE_EN = {
  battery:'In some sources this light is amber and in others red. Red is shown here.',
  abs:'In some sources this light is shown as red. Red is shown here.',
  pads:'In some sources this light is shown as red. Red is shown here.',
  airbag:'Treat this as a check that should not be postponed.',
  washer:'Top up when convenient.'
};
let lang = 'he';
try { lang = (localStorage.getItem('appLang') === 'en') ? 'en' : 'he'; } catch (e) {}
const state = { q:'', c:'all' };
const $ = id => document.getElementById(id);
const COLORS = { red:'var(--red)', amber:'var(--amber)', green:'var(--green)', blue:'var(--blue)' };

function setLangUI() {
  const t = T[lang];
  document.documentElement.lang = lang;
  document.documentElement.dir = lang === 'en' ? 'ltr' : 'rtl';
  $('backLink').textContent = lang === 'en' ? '←' : '→';
  document.title = t.title;
  $('t_h1').textContent = t.title;
  $('t_sub').innerHTML = t.sub;
  $('q').placeholder = t.search;
  $('t_legend').innerHTML = t.legend;
  $('t_note').innerHTML = t.disc;
  $('langBtn').textContent = lang === 'en' ? 'עברית' : 'English';
}

function renderFilters() {
  const t = T[lang];
  const opts = [['all',t.all],['red',t.red],['amber',t.amber],['green',t.green],['blue',t.blue]];
  $('filters').innerHTML = opts.map(([k,l]) =>
    `<button class="chip ${state.c===k?'on':''}" data-c="${k}" style="${k==='all'?'':'color:'+COLORS[k]}">${l}</button>`).join('');
  $('filters').querySelectorAll('.chip').forEach(b => b.onclick = () => { state.c = b.dataset.c; render(); });
}

function render() {
  setLangUI();
  renderFilters();
  const t = T[lang];
  const q = state.q.trim().toLowerCase();
  const items = LIGHTS.filter(l => {
    // החיפוש מחפש בכל השדות, גם בעברית וגם באנגלית, בלי קשר לשפת המסך
    const hay = [l.name, l.desc, l.act, l.note || '', ...l.en].join(' ').toLowerCase();
    return (state.c === 'all' || l.color === state.c) && (!q || hay.includes(q));
  });
  $('list').innerHTML = items.length ? items.map(l => {
    const [name, desc, act] = lang === 'en' ? l.en : [l.name, l.desc, l.act];
    let note = '';
    if (lang === 'en') { if (NOTE_EN[l.id]) note = NOTE_EN[l.id]; }
    else if (l.note) note = l.note;
    return `
    <div class="item" style="--c:${COLORS[l.color]}">
      <div class="ico"><svg style="color:${COLORS[l.color]}"><use href="#${l.sym||l.id}"/></svg>${l.mark ? `<span class="mark">${l.mark}</span>` : ''}</div>
      <div class="body">
        <div class="name">${name}<span class="tag">${t.tags[l.color]}</span></div>
        <div class="desc">${desc}</div>
        <div class="act">${t.act} ${act}${note ? `<br><span style="color:var(--amber)">${t.note} ${note}</span>` : ''}</div>
      </div>
    </div>`; }).join('') : `<div class="empty">${t.none}</div>`;
  $('t_rule').innerHTML = t.rule;
}

$('q').addEventListener('input', e => { state.q = e.target.value; render(); });
$('langBtn').addEventListener('click', () => {
  lang = lang === 'he' ? 'en' : 'he';
  try { localStorage.setItem('appLang', lang); } catch (e) {}
  render();
});
render();
</script>
