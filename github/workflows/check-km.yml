name: check-km

on:
  schedule:
    - cron: '0 1 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node check-km.mjs
      - name: commit changes
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add history.json
          git diff --staged --quiet || (git commit -m "km update $(date -u +%F)" && git push)